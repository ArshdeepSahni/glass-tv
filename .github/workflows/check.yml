name: Check

# Every push to main and every pull request: both apps build, and Glass's unit tests pass. No secrets, nothing
# published: releasing is the Release workflow's (a version tag).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78   # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            launcher/**/*.gradle*
            launcher/gradle/wrapper/gradle-wrapper.properties
            assistant/**/*.gradle*

      - name: Glass builds and its tests pass
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug

      - name: The assistant builds (without its keys)
        working-directory: assistant
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug

      - name: The release scripts are sound
        run: |
          python3 -m py_compile updates/publish.py updates/manifest.py updates/fetch.py
          node --input-type=module --check < updates/worker/index.js
          for f in tools/*.sh; do bash -n "$f"; done
          python3 updates/manifest.py version
