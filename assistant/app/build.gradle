plugins {
    id 'com.android.application'
}

// Where Glass keeps its keys on this computer (as ./glass does, tools/glasscli/paths.py): GLASS_HOME, else
// ~/Desktop/tv on the computer that made Glass, else ~/.glass.
def glassHome() {
    def e = System.getenv('GLASS_HOME')
    if (e) return new File(e)
    def legacy = new File(System.getProperty('user.home'), 'Desktop/tv')
    if (new File(legacy, 'toolchain').isDirectory() || new File(legacy, '.updates.env').isFile() || new File(legacy, '.env').isFile()) return legacy
    return new File(System.getProperty('user.home'), '.glass')
}

def glassKeystore() {
    def e = System.getenv('GLASS_KEYSTORE')
    if (e) return new File(e)
    def home = glassHome()
    def legacy = new File(System.getProperty('user.home'), 'Desktop/tv')
    if (home.absolutePath == legacy.absolutePath) return new File(System.getProperty('user.home'), '.android/debug.keystore')
    return new File(home, 'glass.keystore')
}

// The assistant's keys live only in GLASS_HOME/.env on this computer (never in a chat or the repository).
def env = [:]
def envFile = new File(System.getenv('GLASS_ENV') ?: new File(glassHome(), '.env').path)
if (envFile.exists()) {
    envFile.eachLine { line ->
        def t = line.trim()
        if (t && !t.startsWith('#') && t.contains('=')) {
            def i = t.indexOf('=')
            env[t.substring(0, i).trim()] = t.substring(i + 1).trim().replaceAll(/^["']|["']$/, '')
        }
    }
}
def q = { String k, String d = '' -> '"' + (env[k] ?: d).replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'com.gathin.glass.assistant'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gathin.glass.assistant'
        minSdk 26
        targetSdk 28
        versionCode 7
        versionName '1.0.1'
        buildConfigField 'String', 'CF_ACCOUNT_ID', q('CF_ACCOUNT_ID')
        buildConfigField 'String', 'CF_API_TOKEN', q('CF_API_TOKEN')
        buildConfigField 'String', 'CF_DECIDE_MODEL', q('CF_DECIDE_MODEL', '@cf/meta/llama-3.1-8b-instruct-fast')
        buildConfigField 'String', 'CF_CHAT_MODEL', q('CF_CHAT_MODEL', '@cf/meta/llama-3.3-70b-instruct-fp8-fast')
        buildConfigField 'String', 'GROQ_API_KEY', q('GROQ_API_KEY')
        buildConfigField 'String', 'GROQ_MODEL', q('GROQ_MODEL', 'openai/gpt-oss-120b')
        buildConfigField 'String', 'CEREBRAS_API_KEY', q('CEREBRAS_API_KEY')
        buildConfigField 'String', 'CEREBRAS_MODEL', q('CEREBRAS_MODEL', 'gpt-oss-120b')
        buildConfigField 'String', 'OPENROUTER_API_KEY', q('OPENROUTER_API_KEY')
        buildConfigField 'String', 'OPENROUTER_MODEL', q('OPENROUTER_MODEL', 'meta-llama/llama-3.3-70b-instruct:free')
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        // The key the Glass on the TV is signed with (Android only takes an update signed alike): glassKeystore()
        // above. A debug-style keystore: "android" for both passwords, alias AndroidDebugKey.
        glass {
            storeFile glassKeystore()
            storePassword 'android'
            keyAlias 'AndroidDebugKey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.glass
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        // targetSdk 28 is on purpose (Android TV 9's rules for an app that appears over others). The assistant
        // never goes through Google Play, so Play's minimum target doesn't apply; left on, it stops release builds.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    // springs for the glass (same physics as the desktop); R8 keeps only what's used
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
