plugins {
    id 'com.android.application'
}

// Where Glass keeps its keys on this computer (as ./glass does, tools/glasscli/paths.py): GLASS_HOME, else
// ~/Desktop/tv on the computer that made Glass, else ~/.glass.
def glassHome() {
    def env = System.getenv('GLASS_HOME')
    if (env) return new File(env)
    def legacy = new File(System.getProperty('user.home'), 'Desktop/tv')
    if (new File(legacy, 'toolchain').isDirectory() || new File(legacy, '.updates.env').isFile() || new File(legacy, '.env').isFile()) return legacy
    return new File(System.getProperty('user.home'), '.glass')
}

// The key Glass is signed with: GLASS_KEYSTORE (the release workflow's), else GLASS_HOME/glass.keystore (made by
// ./glass setup), or the Android debug key on the computer that made Glass.
def glassKeystore() {
    def env = System.getenv('GLASS_KEYSTORE')
    if (env) return new File(env)
    def home = glassHome()
    def legacy = new File(System.getProperty('user.home'), 'Desktop/tv')
    if (home.absolutePath == legacy.absolutePath) return new File(System.getProperty('user.home'), '.android/debug.keystore')
    return new File(home, 'glass.keystore')
}

// Glass's update service (Settings ▸ About this TV ▸ Check for updates): its address and key. The release workflow
// passes them in the environment; a build on a computer reads them from GLASS_UPDATES_FILE, else
// GLASS_HOME/.updates.env (KEY=value lines, never in the repository). Without them the build still works and says
// updates aren't set up.
def updateSetting(String name) {
    def v = System.getenv(name)
    if (!v) {
        def path = System.getenv('GLASS_UPDATES_FILE') ?: new File(glassHome(), '.updates.env').path
        def f = new File(path)
        if (f.isFile()) {
            for (line in f.readLines()) {
                def m = line =~ /^\s*(?:export\s+)?([A-Z_]+)\s*=\s*"?([^"]*)"?\s*$/
                if (m.matches() && m.group(1) == name) v = m.group(2)
            }
        }
    }
    v = (v ?: '').trim()
    if (!(v ==~ /[A-Za-z0-9:\/._-]*/)) throw new GradleException("${name} has characters it shouldn't")
    return v
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 27
        versionName '1.0.1'
        buildConfigField 'String', 'UPDATE_URL', "\"${updateSetting('GLASS_UPDATE_URL')}\""
        buildConfigField 'String', 'UPDATE_TOKEN', "\"${updateSetting('GLASS_UPDATE_TOKEN')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // The key the Glass on the TV is signed with (Android only takes an update signed alike): glassKeystore()
        // above. A debug-style keystore: "android" for both passwords, alias AndroidDebugKey.
        glass {
            storeFile glassKeystore()
            storePassword 'android'
            keyAlias 'AndroidDebugKey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.glass
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
